    <a href="/ui/jobs.html">Jobs</a>
    <a href="/ui/das-console.html">DAS console</a>

  <div class="key">
    <label for="apiKey" style="color:#fff">X-Api-Key</label>
    <input id="apiKey" placeholder="dev-local-key" style="width:160px" />
  </div>
</header>

<main>
  <section>
    <h2>Dies</h2>
    <form id="searchForm" class="row">
      <div><label>Status</label><br /><input id="fStatus" placeholder="#" style="width:70px" /></div>
      <button type="submit">Search</button>
      <span id="count" class="muted"></span>
    </form>
    <table>
      <thead><tr><th>Die #</th><th>Name</th><th>Status</th><th>Tool #</th><th>Part</th><th>Location</th></tr></thead>
      <tbody id="dies"></tbody>
    </table>
  </section>

  <section>
    <h2 id="formTitle">New die</h2>
    <div class="grid">
      <div class="fld full"><label>Die name</label><input id="dName" /></div>
      <div class="fld"><label>Owner</label><input id="dOwner" maxlength="32" /></div>
      <div class="fld"><label>Status</label><input id="dStatus" type="number" /></div>
      <div class="fld"><label>Tool #</label><input id="dTool" /></div>
      <div class="fld"><label>Part name</label><input id="dPart" /></div>
      <div class="fld"><label>Gross weight</label><input id="dWeight" type="number" step="0.1" /></div>
      <div class="fld"><label>Location</label><input id="dLocation" /></div>
      <div class="fld full"><label>Description</label><input id="dDesc" /></div>
      <div class="fld"><label>Eng. scrap (Y/N)</label><input id="dEngScrap" maxlength="1" /></div>
      <div class="fld"><label>Parts / hit</label><input id="dPartsHit" type="number" /></div>
      <div class="fld"><label>Angle change (min)</label><input id="dAngleMin" type="number" /></div>
      <div class="fld"><label>Avg die change (min)</label><input id="dAvgChgMin" type="number" /></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnSave" type="button">Save</button>
      <button id="btnNew" type="button" class="sec">New</button>
    </div>
    <div id="ok" class="ok"></div>
  </section>

  <section class="wide"><div id="err" class="err"></div></section>
</main>

<script type="module" src="/ui/app/dies.js"></script>
</body>
</html>
