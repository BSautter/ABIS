  <div class="key">
    <label for="apiKey" style="color:#fff">X-Api-Key</label>
    <input id="apiKey" placeholder="dev-local-key" style="width:160px" />
  </div>
</header>

<main>
  <section>
    <h2>Mechanical test results</h2>
    <form id="filterForm" class="row">
      <div><label>Test type</label><br /><input id="fType" placeholder="#" style="width:70px" /></div>
      <div><label>Position</label><br /><input id="fPosition" placeholder="e.g. T/M/B" style="width:90px" /></div>
      <div><label>From</label><br /><input id="fFrom" type="date" /></div>
      <div><label>To</label><br /><input id="fTo" type="date" /></div>
      <button type="submit">Filter</button>
      <label class="chk"><input id="fInProgress" type="checkbox" /> In-progress (working set)</label>
      <span id="count" class="muted"></span>
    </form>
    <table>
      <thead><tr>
        <th>Date</th><th>Type</th><th>Pos</th>
        <th class="num">YTS</th><th class="num">UTS</th><th class="num">Elong</th>
        <th class="num">n</th><th class="num">r</th><th class="num">Thick</th><th class="num">Width</th>
      </tr></thead>
      <tbody id="results"></tbody>
    </table>
  </section>

  <section><div id="err" class="err"></div></section>
</main>

<script type="module" src="/ui/app/qa-results.js"></script>
</body>
</html>
