name: Release

# Build the native-install tarball on a version tag and attach it to a GitHub
# Release. Tag a release commit on main:  git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required for `gh release create`

jobs:
  release:
    name: Build + publish release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags/history for build-release.sh version detection
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/Directory.Build.props', 'api/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Never ship an untested artifact: run the API suite before packaging.
      - name: Test (API)
        working-directory: api
        run: |
          dotnet restore ABIS.Api.sln
          dotnet test ABIS.Api.sln -c Release

      - name: Build release tarball
        run: bash build-release.sh --version "${GITHUB_REF_NAME}"

      - name: Build .deb package
        run: bash build-deb.sh --version "${GITHUB_REF_NAME}"

      - name: Checksums
        run: ( cd dist && sha256sum *.tar.gz *.deb > SHA256SUMS )

      # Prefer the hand-written CHANGELOG section. GitHub's --generate-notes lists PR titles, which
      # says what was merged rather than what changed for anyone deciding whether to deploy it - and
      # it cannot carry a "Known limitations" section, which is the part that decides that.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag "([^0-9]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/NOTES.md
          if [ -s dist/NOTES.md ]; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "::warning title=No changelog entry::CHANGELOG.md has no section for ${GITHUB_REF_NAME}; falling back to generated notes. See docs/RELEASING.md."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # ONE LINE, no backslash continuations. The notes flag is chosen into a variable instead.
        #
        # The v0.8.0 release failed here: the previous revision of this step was written with `\`
        # continuations and the newlines came out as literal `\n` two-character sequences, so bash saw
        # `gh release create "v0.8.0" \n dist/...` and died globbing for a file called `n`. Everything
        # before it had already succeeded — tests, tarball, .deb, checksums — so the failure landed on
        # the one step that publishes, after all the work.
        #
        # A continuation inside a YAML block scalar is a needless dependency on exact whitespace and
        # line endings surviving every editor and every checkout. A long line is not.
        run: |
          NOTES="--generate-notes"
          if [ "${{ steps.notes.outputs.found }}" = "yes" ]; then NOTES="--notes-file dist/NOTES.md"; fi
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.deb dist/SHA256SUMS --title "ABIS ${GITHUB_REF_NAME}" $NOTES
